seed: 42

data:
  name: wmt14
  lang_pair: fr-en
  max_tokens: 100
  # Output of: python scripts/clean_data.py --src-dir data/raw/wmt14 --out-dir data/clean/wmt14 --max-pairs 200000
  # (already a random 200k sample, so no max_train_pairs here)
  data_dir: data/clean/wmt14
  sp_model: data/vocab/spm_8k_wmt.model

model:
  d_model: 256
  n_heads: 4
  n_encoder_layers: 4
  n_decoder_layers: 4
  d_ff: 512
  dropout: 0.1
  max_seq_len: 128
  shared_vocab: true

tokenizer:
  type: bpe
  # python scripts/train_own_bpe.py --data-dir data/clean/wmt14 --out data/vocab/own_bpe_8k_wmt.json
  path: data/vocab/own_bpe_8k_wmt.json
  vocab_size: 8000
  # Pick from the threshold table train_own_bpe.py prints: the largest value
  # that costs only a few % extra length. 50 is Sennrich's value for ~4M pairs.
  vocab_threshold: 10

training:
  batch_tokens: 8192
  warmup_steps: 4000
  max_steps: 100000
  grad_clip: 1.0
  label_smoothing: 0.1
  fp16: true

inference:
  restrict_target_vocab: true

logging:
  backend: tensorboard
  log_every: 100
  eval_every: 2000
  bleu_sentences: 500