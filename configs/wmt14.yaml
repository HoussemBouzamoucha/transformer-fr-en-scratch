seed: 42

data:
  name: wmt14
  lang_pair: fr-en
  max_tokens: 100
  data_dir: data/raw/wmt14
  sp_model: data/vocab/spm_8k_wmt.model
  max_train_pairs: 200000

model:
  d_model: 256
  n_heads: 4
  n_encoder_layers: 4
  n_decoder_layers: 4
  d_ff: 512
  dropout: 0.1
  max_seq_len: 128
  shared_vocab: true

tokenizer:
  type: sentencepiece
  vocab_size: 8000

training:
  batch_tokens: 8192
  warmup_steps: 4000
  max_steps: 100000
  grad_clip: 1.0
  label_smoothing: 0.1
  fp16: true

logging:
  backend: tensorboard
  log_every: 100
  eval_every: 2000