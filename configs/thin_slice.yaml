seed: 42

data:
  name: multi30k
  lang_pair: fr-en
  max_tokens: 100

model:
  d_model: 256
  n_heads: 2
  n_encoder_layers: 2
  n_decoder_layers: 2
  d_ff: 512
  dropout: 0.1
  max_seq_len: 128
  shared_vocab: true

tokenizer:
  type: bpe                 # bpe (own joint BPE) | sentencepiece
  path: data/vocab/own_bpe_8k_multi30k.json   # scripts/train_own_bpe.py
  vocab_size: 8000
  # Split tokens seen < N times in the sentence's own language. Must match the
  # --vocab-threshold the BPE was fitted with (scripts/train_own_bpe.py).
  # 0 fills all 8k slots with used tokens; 5 only finds 7,256 on Multi30k and
  # blocks FR/EN sharing (data/vocab/own_bpe_8k_multi30k_t5.json).
  vocab_threshold: 0

training:
  batch_tokens: 8192
  warmup_steps: 400
  max_steps: 10000
  grad_clip: 1.0
  label_smoothing: 0.1
  fp16: true

inference:
  restrict_target_vocab: true   # decoder may only emit tokens seen in English

logging:
  backend: tensorboard
  log_every: 50
  eval_every: 500
  bleu_sentences: 500           # greedy BLEU on the first N val sentences each epoch (0 = off)