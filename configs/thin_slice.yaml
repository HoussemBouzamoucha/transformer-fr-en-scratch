seed: 42

data:
  name: multi30k
  lang_pair: fr-en
  max_tokens: 100

model:
  d_model: 256
  n_heads: 2
  n_encoder_layers: 2
  n_decoder_layers: 2
  d_ff: 512
  dropout: 0.1
  max_seq_len: 128
  shared_vocab: true

tokenizer:
  type: bpe                 # bpe (own joint BPE) | sentencepiece
  path: data/vocab/own_bpe_8k_multi30k.json   # scripts/train_own_bpe.py
  vocab_size: 8000
  # Split tokens seen < N times in the sentence's own language. 5 costs ~0.5%
  # longer sequences on Multi30k; 50 (Sennrich's WMT value) costs ~36% here.
  vocab_threshold: 5

training:
  batch_tokens: 8192
  warmup_steps: 400
  max_steps: 10000
  grad_clip: 1.0
  label_smoothing: 0.1
  fp16: true

logging:
  backend: tensorboard
  log_every: 50
  eval_every: 500